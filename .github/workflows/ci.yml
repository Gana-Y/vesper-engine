name: Vesper Engine CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    name: Test Suite (Ubuntu & Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install Compilers & Runtimes (C++ & Java)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends g++ default-jdk

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov ruff

      - name: Lint Code with Ruff
        run: |
          ruff check src/ server.py --ignore E501

      - name: Run Pytest Suite with Coverage
        run: |
          pytest -v --cov=src --cov-report=term-missing
