[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vesper-engine"
version = "1.0.0"
description = "Vesper — Hardened, High-Performance Code Execution Engine & Sandboxed Arbiter"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "Ganesh Yandigeri"}
]
keywords = ["sandbox", "online-judge", "code-execution", "docker", "cgroups", "telemetry"]
dependencies = [
    "docker>=7.0.0",
    "psutil>=5.9.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0"
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
